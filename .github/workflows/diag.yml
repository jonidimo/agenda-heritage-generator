name: diag
on:
  push:
    branches: [lote/eager-faraday-9g1w7y]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --dir --publish never --win
      - name: Como Node (el paso que usará desktop.yml)
        shell: bash
        run: npx tsx scripts/mcp-smoke.ts --env ELECTRON_RUN_AS_NODE=1 -- "release/win-unpacked/Heritage Studio.exe" release/win-unpacked/resources/app.asar/dist-mcp/main.mjs
      - name: --mcp en Windows da el mensaje claro
        shell: bash
        run: |
          set +e
          out=$(npx tsx scripts/mcp-smoke.ts --timeout 15 -- "release/win-unpacked/Heritage Studio.exe" --no-sandbox --mcp 2>&1)
          echo "$out"
          echo "$out" | grep -q "ELECTRON_RUN_AS_NODE" && echo "MENSAJE_OK"
