name: Desktop apps

# Builds the desktop installers (Electron) for Linux, Windows and macOS; see docs/desktop.md.
# Every change to the app or its packaging on main or refactor-v2 builds new installers (as
# artifacts of the run), so the latest ones always match the code. Push a tag such as v2.1.0
# to also publish them in a GitHub Release, or run it by hand (Actions → Desktop apps → Run
# workflow, once this file is on the default branch).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, refactor-v2]
    # Only for branches: GitHub does not apply path filters to tags. Changes to the docs or
    # the tests alone do not rebuild the installers.
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      # The MCP server bundle carries both guides.
      - 'docs/llm-templates.md'
      - 'docs/plantillas-llm.md'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron/**'
      - 'electron-builder.yml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app`: the unpacked app that electron-builder leaves next to the installers, and
          # `bundle`: the MCP server inside its package. Both are started below to prove that the
          # server works from the package.
          - { os: ubuntu-latest, name: linux, app: release/linux-unpacked/agenda-heritage-studio, bundle: release/linux-unpacked/resources/app.asar/dist-mcp/main.mjs }
          - { os: windows-latest, name: windows, app: 'release/win-unpacked/Heritage Studio.exe', bundle: release/win-unpacked/resources/app.asar/dist-mcp/main.mjs }
          - { os: macos-latest, name: macos, app: 'release/mac-arm64/Heritage Studio.app/Contents/MacOS/Heritage Studio', bundle: 'release/mac-arm64/Heritage Studio.app/Contents/Resources/app.asar/dist-mcp/main.mjs' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web app (also generates the holiday data: prebuild hook, about a minute) and the MCP
      # server bundle that the app carries.
      - run: npm run build:desktop
      # Targets per OS are in electron-builder.yml. No certificates: Windows builds are unsigned
      # and macOS builds ad-hoc signed.
      - run: npx electron-builder --publish never
      # The packaged app as an AI client launches it. Windows cannot use --mcp (a graphical program
      # gets no standard input there), so on every system the same executable is also run as plain
      # Node (ELECTRON_RUN_AS_NODE), which is the form documented for Windows.
      # --no-sandbox because CI runners restrict Chromium's sandbox; --ozone-platform=headless
      # because there is no display server on Linux.
      - name: MCP server works inside the package (--mcp)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          flags=(--no-sandbox)
          if [ "${{ matrix.name }}" = linux ]; then flags+=(--ozone-platform=headless); fi
          npx tsx scripts/mcp-smoke.ts -- "${{ matrix.app }}" "${flags[@]}" --mcp
      - name: MCP server works inside the package (as Node)
        shell: bash
        run: npx tsx scripts/mcp-smoke.ts --env ELECTRON_RUN_AS_NODE=1 -- "${{ matrix.app }}" "${{ matrix.bundle }}"
      # The AppImage as documented for MCP: extracted once, then its AppRun is the command. (Its
      # --appimage-extract-and-run mode prints the extracted files on stdout, so it is not usable.)
      - name: MCP server works from the extracted AppImage
        if: matrix.name == 'linux'
        run: |
          mkdir appimage && cd appimage
          ../release/heritage-studio-*-linux-x86_64.AppImage --appimage-extract > /dev/null
          cd ..
          npx tsx scripts/mcp-smoke.ts -- "$PWD/appimage/squashfs-root/AppRun" --no-sandbox --ozone-platform=headless --mcp
      - uses: actions/upload-artifact@v7
        with:
          name: heritage-studio-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release
    # Also when one system failed (for example, no Mac machine was free): the release goes out
    # with the files that were built. Re-running the failed job and then this one adds the rest.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: heritage-studio-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # v2.1.0-beta.1 and similar tags become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
